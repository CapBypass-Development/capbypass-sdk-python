name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Type check with mypy
      run: |
        mypy src/

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=capbypass --cov-report=term-missing

    - name: Detect integration secret
      id: intsecret
      env:
        CAPBYPASS_TEST_KEY: ${{ secrets.CAPBYPASS_TEST_KEY }}
      run: |
        [ -n "$CAPBYPASS_TEST_KEY" ] && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"

    - name: Run integration tests
      if: steps.intsecret.outputs.available == 'true'
      env:
        CAPBYPASS_TEST_KEY: ${{ secrets.CAPBYPASS_TEST_KEY }}
      run: |
        pytest tests/integration/ -v -m "not slow"

    - name: Check coverage
      run: |
        pytest tests/unit/ --cov=capbypass --cov-report=term --cov-fail-under=80
