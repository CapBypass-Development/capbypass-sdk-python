name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute the version and build, but do not publish, tag or release'
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -e ".[dev]"

    - name: Run tests
      run: pytest tests/unit/ -v

    # main is branch-protected, so the workflow never pushes to it. The version
    # comes from the latest vX.Y.Z tag and is written into pyproject.toml only
    # in the runner workspace, for the build. The tag is pushed after publishing.
    - name: Compute next version
      run: |
        LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed -n 1p)
        if [ -z "$LATEST_TAG" ]; then
          echo "::error::No vX.Y.Z tag found (is the checkout shallow, or the tags missing?); refusing to guess a version"
          exit 1
        fi
        IFS='.' read -r major minor patch <<< "${LATEST_TAG#v}"
        NEW_VERSION="$major.$minor.$((patch + 1))"
        STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/capbypass-sdk/${NEW_VERSION}/json")
        if [ "$STATUS" = "200" ]; then
          echo "::error::capbypass-sdk ${NEW_VERSION} already exists on PyPI (latest tag is ${LATEST_TAG}); push the missing tag v${NEW_VERSION} or fix the tags"
          exit 1
        elif [ "$STATUS" != "404" ]; then
          echo "::error::Unexpected HTTP ${STATUS} from PyPI while checking ${NEW_VERSION}"
          exit 1
        fi
        sed -i -E "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" pyproject.toml
        WRITTEN=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        if [ "$WRITTEN" != "$NEW_VERSION" ]; then
          echo "::error::Failed to write ${NEW_VERSION} into pyproject.toml (found ${WRITTEN})"
          exit 1
        fi
        echo "Latest tag ${LATEST_TAG}, next version ${NEW_VERSION}"
        echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      if: ${{ !inputs.dry_run }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Create tag
      if: ${{ !inputs.dry_run }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "v${{ env.VERSION }}"
        git push origin "v${{ env.VERSION }}"

    - name: Create GitHub Release
      if: ${{ !inputs.dry_run }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        body: |
          Release v${{ env.VERSION }}

          Install: `pip install capbypass-sdk==${{ env.VERSION }}`
        draft: false
        prerelease: false
